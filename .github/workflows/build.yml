name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    permissions:
      contents: write        # Dependency Submission API 需要寫入權限
      security-events: write
      pull-requests: write   # SonarQube 在 PR 上寫入分析結果

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # ── SonarQube 掃描（Dependabot PR 無法取得 Secrets，跳過）──────────────
      - uses: SonarSource/sonarqube-scan-action@v6
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── Quality Gate：掃描結果不通過則阻止 Merge ────────────────────────────
      - name: SonarQube Quality Gate check
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── SBOM：以下只在 push main 時執行（PR 不需要提交相依性圖）────────────
      - name: Generate SBOM from repository source
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          artifact-name: sbom-repo.spdx.json
          output-file: /tmp/sbom-repo.spdx.json
          format: spdx-json

      - name: Submit repo SBOM to GitHub Dependency Graph
        if: github.event_name == 'push'
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: /tmp/sbom-repo.spdx.json

      - name: Build Docker image for SBOM scan
        if: github.event_name == 'push'
        run: docker build -t apac-app:${{ github.sha }} .

      - name: Generate SBOM from Docker image
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: apac-app:${{ github.sha }}
          artifact-name: sbom-docker.spdx.json
          output-file: /tmp/sbom-docker.spdx.json
          format: spdx-json

      - name: Submit Docker SBOM to GitHub Dependency Graph
        if: github.event_name == 'push'
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: /tmp/sbom-docker.spdx.json
