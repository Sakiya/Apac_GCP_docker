sonar.projectKey=Sakiya_Apac_GCP_docker_6f1b1d51-49ed-4e0b-9db1-cd4cec0c2add
sonar.projectName=Apac GCP Docker
sonar.projectVersion=1.0

# 指定要掃描的原始碼範圍（只掃自己寫的程式碼）
sonar.sources=www/protected,www/index.php,www/admin/main,www/main/js

# PHP 語言設定
sonar.language=php
sonar.php.version=8.1

# 編碼
sonar.sourceEncoding=UTF-8

# PR 裝飾：讓 SonarQube 在 GitHub PR 頁面直接顯示分析結果
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=Sakiya/Apac_GCP_docker

# 排除第三方框架、函式庫、壓縮檔、資源
sonar.exclusions=\
  yii/**,\
  www/protected/extensions/**,\
  www/assets/**,\
  www/protected/runtime/**,\
  www/images/**,\
  www/admin/css/**,\
  www/admin/script/**,\
  www/main/css/**,\
  www/main/js/plugins/**,\
  www/main/js/plugins2/**,\
  www/main/js/*.min.js,\
  www/main/js/jquery*.js,\
  www/main/js/bootstrap*.js,\
  www/main/js/modernizr*.js,\
  www/main/js/sweetalert.js,\
  www/main/js/html2canvas.js,\
  www/main/js/canvas2image.js,\
  www/main/js/imageLoader.js,\
  logs/**,\
  uploads/**,\
  **/*.zip,\
  **/*.7z,\
  **/*.sql,\
  **/*.min.js,\
  **/*.min.css
