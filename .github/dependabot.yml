version: 2
updates:
  # GitHub Actions 版本自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Docker base image 版本自動更新
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # 前端 Javascript 套件 (NPM) 自動更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # 🌟 避免前端大版本升級導致畫面版面崩潰 (如 jQuery 1.x/2.x 升級 3.x，或 Bootstrap 3 升至 4/5)
    ignore:
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jquery-ui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]


